<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICO Host</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#060914;--card:rgba(14,20,38,.78);--line:rgba(120,140,255,.16);--txt:#e2e8f0;--muted:#8b97b5;--cyan:#22d3ee;--indigo:#6366f1;--violet:#8b5cf6;--green:#10b981;--red:#f43f5e;--amber:#f59e0b;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;min-height:100vh;padding:14px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(100px);opacity:.22;pointer-events:none;z-index:0;animation:drift 22s ease-in-out infinite alternate}
body::before{background:var(--indigo);top:-28vmax;left:-22vmax}
body::after{background:var(--cyan);bottom:-28vmax;right:-22vmax;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.12)}}
#app,#toasts{position:relative;z-index:1}

/* ---- keyframes ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}

/* ---- page & panel entrance ---- */
.wrap,.auth,#panel>*,.card,.modal{animation:fadeUp .5s var(--ease) backwards}
.modal{animation:popIn .35s var(--ease) backwards}
.modal-bg{animation:fadeIn .25s ease backwards;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.grid>*{animation:popIn .45s var(--ease) backwards}
.grid>:nth-child(2){animation-delay:.05s}.grid>:nth-child(3){animation-delay:.1s}.grid>:nth-child(4){animation-delay:.15s}
.grid>:nth-child(5){animation-delay:.2s}.grid>:nth-child(6){animation-delay:.25s}.grid>:nth-child(n+7){animation-delay:.3s}

/* ---- layout ---- */
.wrap{max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 50px -28px rgba(0,0,0,.7);transition:border-color .3s,box-shadow .35s}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 18px}
.brand{font-weight:800;color:var(--cyan);font-size:18px;text-decoration:none;display:inline-flex;gap:8px;align-items:center;transition:transform .3s var(--ease)}
.brand:hover{transform:translateX(-3px)}
.brand i{animation:float 3.5s ease-in-out infinite}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
h2{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2 i{color:var(--cyan)}
h3{font-size:15px;margin:14px 0 8px;color:#cbd5e1}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.mt{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label,label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}

/* ---- inputs ---- */
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(7,11,24,.8);color:var(--txt);font-family:inherit;font-size:14px;transition:border-color .25s,box-shadow .25s,background .25s}
input:hover,select:hover,textarea:hover{border-color:rgba(120,140,255,.4)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.14);background:#0a1024}
textarea{font-family:Consolas,monospace;min-height:280px;direction:ltr}

/* ---- buttons (press, hover lift, shine, ripple) ---- */
button,.btn{position:relative;overflow:hidden;font-family:inherit;font-size:14px;font-weight:700;border:0;border-radius:12px;padding:10px 16px;color:#fff;cursor:pointer;background:linear-gradient(120deg,var(--indigo),var(--cyan));display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;transition:transform .2s var(--ease),box-shadow .3s,filter .3s,border-color .3s,color .3s}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px -12px rgba(99,102,241,.8);filter:brightness(1.08)}
button:hover:not(:disabled)::after{animation:shine .8s var(--ease)}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.5;cursor:not-allowed}
button i{transition:transform .35s var(--ease)}
button:hover:not(:disabled) i{transform:scale(1.15)}
button.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt)}
button.ghost:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.3),0 10px 24px -12px rgba(34,211,238,.6);filter:none}
button.red{background:linear-gradient(120deg,#be123c,var(--red))}
button.green{background:linear-gradient(120deg,#059669,var(--green))}
button.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}

/* ---- badges, bars, stats ---- */
.badge{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid;animation:fadeIn .4s ease backwards}
.badge.ok{color:var(--green);border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1)}
.badge.ok i{animation:pulse 2s infinite;border-radius:50%}
.badge.off{color:var(--red);border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.1)}
.badge.warn{color:var(--amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.1)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--cyan));transition:width .8s var(--ease)}
.bar>i.warn{background:linear-gradient(90deg,var(--amber),var(--red))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{padding:14px;border-radius:14px;background:rgba(7,11,24,.7);border:1px solid var(--line);transition:transform .35s var(--ease),border-color .3s,box-shadow .3s}
.stat:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.4);box-shadow:0 14px 28px -16px rgba(34,211,238,.5)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

/* ---- server cards ---- */
.srv{cursor:pointer;margin:0;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.srv:hover{transform:translateY(-6px);border-color:rgba(34,211,238,.55);box-shadow:0 22px 40px -20px rgba(34,211,238,.4)}
.srv:active{transform:scale(.98)}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(34,211,238,.2));color:var(--cyan);font-size:20px;flex:0 0 auto;overflow:hidden;transition:transform .4s var(--ease)}
.srv:hover .ico{transform:rotate(-6deg) scale(1.08)}
.ico img{width:100%;height:100%;object-fit:cover}
.addr{font-family:Consolas,monospace;font-size:12px;color:var(--cyan);background:rgba(7,11,24,.8);padding:8px 10px;border-radius:10px;border:1px dashed var(--line);word-break:break-all;direction:ltr;text-align:left}

/* ---- server layout & side nav ---- */
.layout{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}
.side{padding:8px}
.side a{display:flex;gap:9px;align-items:center;padding:11px 13px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:700;margin-bottom:4px;transition:background .3s,color .3s,transform .35s var(--ease)}
.side a:hover{background:rgba(255,255,255,.05);color:#fff;transform:translateX(-4px)}
.side a.on{background:linear-gradient(120deg,rgba(99,102,241,.35),rgba(34,211,238,.15));color:#fff;box-shadow:inset 0 0 0 1px rgba(34,211,238,.25);animation:slideIn .45s var(--ease) backwards}
.side a.on i{color:var(--cyan)}

/* ---- terminal, table, gallery ---- */
.term{background:#02040c;border:1px solid #13204a;border-radius:14px;padding:12px;height:380px;overflow:auto;font-family:Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left;white-space:pre-wrap}
.term .t{color:#475569}.term .ok{color:var(--green)}.term .warn{color:var(--amber)}.term .err{color:var(--red)}.term .info{color:var(--cyan)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.table th{color:var(--muted)}
.table tr{transition:background .25s}
.table tbody tr:hover{background:rgba(255,255,255,.03)}
.tw{overflow-x:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery .card{padding:8px;margin:0}
.gallery img{width:100%;height:120px;object-fit:cover;border-radius:10px;background:rgba(7,11,24,.8);transition:transform .4s var(--ease)}
.gallery .card:hover img{transform:scale(1.04)}
.item{display:flex;gap:10px;align-items:center;padding:11px;border-radius:12px;background:rgba(7,11,24,.7);border:1px solid var(--line);margin-bottom:7px;flex-wrap:wrap;transition:transform .3s var(--ease),border-color .3s;animation:slideIn .4s var(--ease) backwards}
.item:hover{transform:translateX(-3px);border-color:rgba(34,211,238,.35)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .3s,background .3s,color .3s}
.drop:hover{border-color:var(--cyan);color:var(--txt);background:rgba(34,211,238,.05)}
.notice{padding:11px 13px;border-radius:12px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.25);font-size:13px;line-height:1.7;margin:10px 0}
.notice i{color:var(--cyan)}

/* ---- auth screen ---- */
.auth{max-width:420px;margin:6vh auto}
.auth-card{padding:30px 26px;border-radius:24px;background:linear-gradient(180deg,rgba(22,30,58,.92),rgba(10,14,30,.92));position:relative;overflow:hidden}
.auth-card::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,var(--indigo),transparent 40%,var(--cyan));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7}
.orb{width:74px;height:74px;margin:0 auto 12px;border-radius:24px;display:grid;place-items:center;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--indigo),var(--cyan));box-shadow:0 16px 40px -10px rgba(99,102,241,.8);animation:float 4s ease-in-out infinite}
.auth .tabs{margin-bottom:14px}
.auth form>*+*{margin-top:10px}
.auth button.w{width:100%;padding:12px;font-size:15px;margin-top:14px}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(5,8,20,.65)}
.tabs button{flex:1;background:transparent;border:0;color:var(--muted);box-shadow:none;padding:9px 6px;font-size:13px}
.tabs button:hover:not(:disabled){transform:none;color:#fff;box-shadow:none;filter:none}
.tabs button::after{display:none}
.tabs button.on{color:#fff;background:linear-gradient(120deg,var(--indigo),var(--violet));box-shadow:0 8px 20px -10px var(--indigo);animation:popIn .4s var(--ease)}

/* ---- modal & toasts ---- */
.modal-bg{position:fixed;inset:0;background:rgba(3,5,12,.7);display:grid;place-items:center;padding:14px;z-index:50}
.modal{background:rgba(14,20,38,.97);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.toasts{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:rgba(15,23,48,.97);border:1px solid var(--line);border-right:4px solid var(--green);padding:11px 15px;border-radius:12px;font-size:14px;max-width:340px;box-shadow:0 14px 30px -12px rgba(0,0,0,.7);animation:slideIn .4s var(--ease) backwards;transition:opacity .3s,transform .3s}
.toast.err{border-right-color:var(--red)}
.toast.info{border-right-color:var(--cyan)}
.toast.out{opacity:0;transform:translateY(8px)}

/* ---- responsive ---- */
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .side{display:flex;gap:4px;overflow-x:auto}
  .side a{white-space:nowrap;margin:0}
  .form{grid-template-columns:1fr}
  .term{height:260px}
}
/* respect users who turn off motion */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), dot = document.createElement('span');
  dot.className = 'ripple';
  dot.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(dot);
  setTimeout(() => dot.remove(), 650);
});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = b => { if (!b) return '0 B'; if (b < 1024) return b + ' B'; const u = ['KB', 'MB', 'GB']; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 2); return b.toFixed(1) + ' ' + u[i]; };
const fmtDate = t => new Date(t).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
const pct = (a, b) => Math.min(100, b ? a / b * 100 : 0);
const TYPE = { website: ['fa-globe', 'موقع'], bot: ['fa-robot', 'بوت'], photo: ['fa-images', 'صور'] };
const LANG = { py: ['Python', 'fab fa-python'], js: ['JavaScript', 'fab fa-js'], php: ['PHP', 'fab fa-php'], java: ['Java', 'fab fa-java'] };
const TEXT_EXT = /\.(txt|md|json|js|ts|py|php|java|html?|css|xml|yml|yaml|env|cfg|ini|csv|sh|go|rb|ts)$/i;
const BIN_EXT = /\.(png|jpe?g|gif|webp|ico|zip|jar|class|exe|dll|so|pdf|mp3|mp4|woff2?|ttf|otf)$/i;

let token = localStorage.getItem('ico_token') || '';
let role = localStorage.getItem('ico_role') || '';
let cfg = { platformName: 'ICO Host', broadcast: null };
let timer = null;

const toast = (msg, type = '') => {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3500);
};

async function api(method, path, body) {
  const r = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(true); throw new Error('انتهت الجلسة، سجل الدخول من جديد'); }
  if (!r.ok) throw new Error(data.error || 'خطأ في الخادم');
  return data;
}

const readAsDataURL = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(new Error('تعذر قراءة الملف'));
  r.readAsDataURL(f);
});

function poll(fn, ms) { clearInterval(timer); timer = setInterval(fn, ms); }

function logout(silent) {
  token = ''; role = '';
  localStorage.removeItem('ico_token'); localStorage.removeItem('ico_role');
  clearInterval(timer);
  if (!silent) toast('تم تسجيل الخروج', 'info');
  location.hash = '#/';
  route();
}

function mount(inner) {
  $('#app').innerHTML = `<div class="wrap">
    <header class="card top">
      <a class="brand" href="#/"><i class="fas fa-rocket"></i> ${esc(cfg.platformName)}</a>
      <div class="row">${role === 'admin' ? '<span class="badge warn"><i class="fas fa-shield-alt"></i> أدمن</span>' : ''}
        <button class="ghost sm" id="out"><i class="fas fa-sign-out-alt"></i> خروج</button></div>
    </header>${cfg.broadcast ? `<div class="card" style="border-color:rgba(245,158,11,.4)">📢 ${esc(cfg.broadcast.text)}</div>` : ''}${inner}</div>`;
  $('#out').onclick = () => logout();
}

/* ================= Router ================= */
function route() {
  clearInterval(timer);
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!token) return loginPage(parts[0] === 'admin' ? 'admin' : 'login');
  if (role === 'admin') return adminPage(parts[0] === 'admin' ? parts[1] || 'stats' : 'stats');
  if (parts[0] === 'srv' && parts[1]) return serverPage(parts[1], parts[2] || 'log');
  return dashPage();
}
window.addEventListener('hashchange', route);

/* ================= Auth ================= */
function loginPage(mode = 'login') {
  $('#app').innerHTML = `<div class="auth"><div class="card auth-card">
    <div class="orb"><i class="fas fa-rocket"></i></div>
    <h2 style="justify-content:center;font-size:22px">${esc(cfg.platformName)}</h2>
    <p class="muted" style="text-align:center;margin:4px 0 16px">استضافة مواقع وبوتات وصور</p>
    <div class="tabs">
      <button class="${mode === 'login' ? 'on' : ''}" data-m="login">دخول</button>
      <button class="${mode === 'register' ? 'on' : ''}" data-m="register">إنشاء حساب</button>
      <button class="${mode === 'admin' ? 'on' : ''}" data-m="admin">أدمن</button>
    </div>
    ${mode === 'admin' ? `<label>كلمة مرور الأدمن</label><input id="ap" type="password" class="mt"><p class="muted small mt">الأدمن يدخل بكلمة المرور فقط، ولا يوجد يوزر للأدمن.</p>`
      : `<label class="mt">اسم المستخدم</label><input id="u" autocomplete="off"><label class="mt">كلمة المرور</label><input id="p" type="password">`}
    ${mode === 'register' ? `<div class="notice">الحساب المجاني: ${10} أيام • 3 جيجا • 512 MB رام • 50% معالج</div>` : ''}
    <button class="mt w" id="go" style="width:100%">${mode === 'register' ? 'إنشاء الحساب' : 'دخول'}</button>
  </div></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => loginPage(b.dataset.m));
  $('#go').onclick = () => submitAuth(mode);
  const f = $('#ap') || $('#p');
  f.addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(mode); });
}

async function submitAuth(mode) {
  try {
    let r;
    if (mode === 'admin') r = await api('POST', '/admin/login', { password: $('#ap').value });
    else if (mode === 'register') r = await api('POST', '/register', { username: $('#u').value.trim(), password: $('#p').value });
    else r = await api('POST', '/login', { username: $('#u').value.trim(), password: $('#p').value });
    token = r.token;
    role = r.admin ? 'admin' : 'user';
    localStorage.setItem('ico_token', token);
    localStorage.setItem('ico_role', role);
    location.hash = '#/';
    route();
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= User dashboard ================= */
async function dashPage() {
  const [me, list] = await Promise.all([api('GET', '/me'), api('GET', '/servers')]);
  const left = Math.max(0, Math.ceil((me.expiresAt - Date.now()) / 864e5));
  mount(`
    <section class="card">
      <h2><i class="fas fa-bolt"></i> أهلاً ${esc(me.username)}</h2>
      <div class="stats">
        <div class="stat"><b>${left}</b><span>يوم متبقٍ من ${me.days}</span></div>
        <div class="stat"><b>${list.length}</b><span>سيرفر</span></div>
        <div class="stat"><b>${list.filter(s => s.status === 'running').length}</b><span>يعمل الآن</span></div>
        <div class="stat"><b>${me.ram} MB</b><span>الرام المسموحة</span></div>
        <div class="stat"><b>${me.cpu}%</b><span>المعالج المسموح</span></div>
        <div class="stat"><b>${fmt(me.used)}</b><span>من ${fmt(me.spaceBytes)}</span></div>
      </div>
      <div class="bar"><i class="${pct(me.used, me.spaceBytes) > 85 ? 'warn' : ''}" style="width:${pct(me.used, me.spaceBytes)}%"></i></div>
    </section>
    <section class="card">
      <div class="row between"><h2><i class="fas fa-server"></i> سيرفراتي</h2><button id="newSrv"><i class="fas fa-plus"></i> سيرفر جديد</button></div>
      ${list.length ? `<div class="grid">${list.map(srvCard).join('')}</div>` : '<p class="muted">لا توجد سيرفرات. أنشئ أول سيرفر.</p>'}
    </section>
    <section class="card"><h2><i class="fas fa-link"></i> اختصار الروابط</h2>
      <form id="lk" class="form"><div class="full"><input id="lkUrl" placeholder="https://example.com" dir="ltr"></div>
      <div><input id="lkAlias" placeholder="اسم مخصص (اختياري)" dir="ltr"></div><button type="submit">اختصر</button></form>
      <div id="lkList" class="mt"></div></section>`);
  $('#newSrv').onclick = newServerModal;
  document.querySelectorAll('[data-open]').forEach(c => c.onclick = () => location.hash = `#/srv/${c.dataset.open}/log`);
  $('#lk').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('POST', '/links', { url: $('#lkUrl').value.trim(), alias: $('#lkAlias').value.trim() });
      toast('تم الاختصار'); dashPage();
    } catch (err) { toast(err.message, 'err'); }
  };
  const links = await api('GET', '/links');
  $('#lkList').innerHTML = links.map(l => `<div class="item"><div class="grow"><div class="addr">${location.origin}${esc(l.short)}</div>
    <div class="muted small">${l.clicks} نقرة • ${esc(l.target.slice(0, 60))}</div></div>
    <button class="ghost sm" data-copy="${esc(location.origin + l.short)}"><i class="fas fa-copy"></i></button>
    <button class="red sm" data-ldel="${esc(l.code)}"><i class="fas fa-trash"></i></button></div>`).join('') || '<p class="muted small">لا توجد روابط بعد</p>';
  $('#lkList').onclick = async e => {
    const c = e.target.closest('[data-copy]'), d = e.target.closest('[data-ldel]');
    if (c) { navigator.clipboard?.writeText(c.dataset.copy); toast('تم النسخ', 'info'); }
    if (d) { await api('DELETE', '/links/' + d.dataset.ldel); dashPage(); }
  };
}

function srvCard(s) {
  const ico = s.type === 'bot' ? (LANG[s.lang]?.[1] || 'fa-robot') : TYPE[s.type][0];
  const sub = s.type === 'photo' ? `${s.images.length} صورة` : s.type === 'bot' ? (LANG[s.lang]?.[0] || '') : 'موقع HTML';
  return `<article class="card srv" data-open="${esc(s.id)}" style="margin:0">
    <div class="row between"><div class="ico"><i class="${ico.includes(' ') ? ico : 'fas ' + ico}"></i></div>${badge(s)}</div>
    <h3>${esc(s.name)}</h3><p class="muted small">${TYPE[s.type][1]} • ${sub} • ${fmt(s.size)}</p>
    ${s.url ? `<div class="addr mt">${location.origin}${esc(s.url)}</div>` : ''}</article>`;
}

function badge(s) {
  const map = { running: ['ok', 'يعمل'], stopped: ['off', 'متوقف'], banned: ['off', 'محظور'], expired: ['off', 'منتهي'], deleted: ['off', 'محذوف'] };
  const [c, t] = map[s.state] || ['off', s.state];
  return `<span class="badge ${c}">${c === 'ok' ? '<i class="fas fa-circle" style="font-size:7px"></i>' : ''}${t}</span>`;
}

function newServerModal() {
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `<div class="modal">
    <div class="row between"><h2><i class="fas fa-plus-circle"></i> سيرفر جديد</h2><button class="ghost sm" id="mx"><i class="fas fa-times"></i></button></div>
    <label>اسم السيرفر</label><input id="nName" class="mt" dir="ltr">
    <label class="mt">النوع</label>
    <select id="nType">${Object.entries(TYPE).map(([k, v]) => `<option value="${k}">${v[1]}</option>`).join('')}</select>
    <div id="nLangBox"></div>
    <label class="mt" id="nFileLabel"></label>
    <label class="drop" id="nDrop"><i class="fas fa-cloud-upload-alt"></i> <span id="nFileTxt">اختر الملفات</span><input type="file" id="nFiles" hidden multiple></label>
    <div class="row mt" style="justify-content:flex-end"><button id="nGo"><i class="fas fa-rocket"></i> إنشاء وتشغيل</button></div>
    <p class="muted small mt" id="nProg"></p></div>`;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  $('#mx', wrap).onclick = close;
  wrap.onclick = e => { if (e.target === wrap) close(); };

  const sync = () => {
    const t = $('#nType', wrap).value;
    $('#nLangBox', wrap).innerHTML = t === 'bot' ? `<label class="mt">لغة البوت</label><select id="nLang">${Object.entries(LANG).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select>` : '';
    $('#nFileLabel', wrap).textContent = t === 'website' ? 'ملف HTML (أو zip لموقع كامل)' : t === 'bot' ? 'ملفات البوت (أي لغة) أو zip' : 'الصور';
    $('#nFiles', wrap).accept = t === 'website' ? '.html,.htm,.zip' : t === 'photo' ? 'image/*' : '';
    $('#nFiles', wrap).multiple = t !== 'website';
  };
  $('#nType', wrap).onchange = sync;
  sync();
  $('#nFiles', wrap).onchange = e => { $('#nFileTxt', wrap).textContent = `${e.target.files.length} ملف محدد`; };

  $('#nGo', wrap).onclick = async () => {
    const name = $('#nName', wrap).value.trim();
    const type = $('#nType', wrap).value;
    const lang = $('#nLang', wrap)?.value || null;
    const files = [...$('#nFiles', wrap).files];
    if (!name) return toast('اكتب اسم السيرفر', 'err');
    if (type === 'bot' && !files.length) return toast('ارفع ملفات البوت أولاً', 'err');
    if (type === 'photo' && !files.length) return toast('اختر صوراً أولاً', 'err');
    const btn = $('#nGo', wrap);
    btn.disabled = true;
    try {
      const s = await api('POST', '/servers', { name, type, lang });
      for (let i = 0; i < files.length; i++) {
        $('#nProg', wrap).textContent = `رفع ${i + 1} / ${files.length}...`;
        await uploadFile(s.id, type, files[i]);
      }
      if (type === 'bot') { $('#nProg', wrap).textContent = 'تشغيل البوت...'; await api('POST', `/servers/${s.id}/power`, { on: true }).catch(e => toast(e.message, 'err')); }
      close();
      toast('تم إنشاء السيرفر');
      location.hash = `#/srv/${s.id}/log`;
      route();
    } catch (e) { toast(e.message, 'err'); btn.disabled = false; }
  };
}

/* Uploads one file to a server according to its type */
async function uploadFile(id, type, f) {
  if (type === 'photo') return api('POST', `/servers/${id}/images`, { name: f.name, data: await readAsDataURL(f) });
  if (/\.zip$/i.test(f.name)) return api('POST', `/servers/${id}/zip`, { data: (await readAsDataURL(f)).split(',')[1] });
  if (BIN_EXT.test(f.name)) return; // binaries are not supported inside bots/sites
  const path = type === 'website' ? 'index.html' : f.name;
  return api('POST', `/servers/${id}/file`, { path, text: await f.text() });
}

/* ================= Server panel ================= */
async function serverPage(id, tab) {
  clearInterval(timer);
  let s;
  try { s = await api('GET', `/servers/${id}`); }
  catch (e) { mount(`<section class="card"><p>${esc(e.message)}</p><a class="btn ghost" href="#/">رجوع</a></section>`); return; }
  const tabs = [['log', 'fa-terminal', 'LOG'], ['file', 'fa-folder-open', 'File'], ['settings', 'fa-sliders-h', 'Settings'], ['resources', 'fa-microchip', 'Resources']];
  const isRun = s.status === 'running';
  mount(`
    <section class="card row between">
      <div class="row"><div class="ico">${s.image ? `<img src="${esc(s.image)}" alt="">` : `<i class="fas ${s.type === 'bot' ? (LANG[s.lang]?.[1] || 'fa-robot') : TYPE[s.type][0]}"></i>`}</div>
        <div><h2 style="margin:0">${esc(s.name)}</h2><div class="muted small">${TYPE[s.type][1]}${s.type === 'bot' ? ' • ' + (LANG[s.lang]?.[0] || '') : ''}</div></div></div>
      <div class="row">${badge(s)}${s.type === 'bot' ? `<button id="pw" class="${isRun ? 'red' : 'green'}"><i class="fas ${isRun ? 'fa-stop' : 'fa-play'}"></i> ${isRun ? 'إيقاف' : 'تشغيل'}</button>` : ''}</div>
    </section>
    <div class="layout"><nav class="card side" style="padding:8px">
      ${tabs.map(([k, i, n]) => `<a href="#/srv/${id}/${k}" class="${tab === k ? 'on' : ''}"><i class="fas ${i}"></i> ${n}</a>`).join('')}
    </nav><section class="card" id="panel" style="min-height:420px"></section></div>`);

  if ($('#pw')) $('#pw').onclick = async () => {
    try { await api('POST', `/servers/${id}/power`, { on: !isRun }); serverPage(id, tab); }
    catch (e) { toast(e.message, 'err'); }
  };
  const panel = $('#panel');
  ({ log: tabLog, file: tabFile, settings: tabSettings, resources: tabRes })[tab]?.(id, s, panel);
}

function logHTML(logs) {
  return (logs || []).map(l => `<div><span class="t">[${new Date(l.t).toLocaleTimeString('ar-EG')}]</span> <span class="${l.type}">${esc(l.msg)}</span></div>`).join('') || '<div class="muted">لا توجد سجلات بعد</div>';
}

function tabLog(id, s, el) {
  el.innerHTML = `<h2><i class="fas fa-terminal"></i> LOG</h2><div class="term" id="term">${logHTML(s.logs)}</div><p class="muted small mt">تحديث تلقائي كل ثانيتين</p>`;
  const term = $('#term');
  term.scrollTop = term.scrollHeight;
  poll(async () => {
    if (!$('#term')) return clearInterval(timer);
    const x = await api('GET', `/servers/${id}`).catch(() => null);
    if (!x) return;
    const atBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 20;
    term.innerHTML = logHTML(x.logs);
    if (atBottom) term.scrollTop = term.scrollHeight;
  }, 2000);
}

async function tabFile(id, s, el) {
  if (s.type === 'photo') return photoFiles(id, s, el);
  const { files } = await api('GET', `/servers/${id}/files`);
  el.innerHTML = `<h2><i class="fas fa-folder-open"></i> File</h2>
    ${s.type === 'bot' ? `<div class="notice">التشغيل يتم على الخادم: ${esc(LANG[s.lang]?.[0] || '')} — الملف الرئيسي: <b dir="ltr">${esc(s.entry || 'غير محدد')}</b></div>` : ''}
    <label class="drop"><i class="fas fa-cloud-upload-alt"></i> ارفع ملفات أو zip (تستبدل المتشابهة)<input type="file" id="up" multiple hidden></label>
    <div class="mt">${files.map(f => `<div class="item">
        <i class="fas ${TEXT_EXT.test(f.path) ? 'fa-file-code' : 'fa-file'}" style="color:var(--cyan)"></i>
        <div class="grow"><b dir="ltr">${esc(f.path)}</b> ${s.entry === f.path ? '<span class="badge ok">رئيسي</span>' : ''}<div class="muted small">${fmt(f.size)}</div></div>
        ${TEXT_EXT.test(f.path) ? `<button class="ghost sm" data-edit="${esc(f.path)}"><i class="fas fa-pen"></i></button>` : ''}
        ${s.type === 'bot' && s.entry !== f.path ? `<button class="ghost sm" data-main="${esc(f.path)}"><i class="fas fa-star"></i></button>` : ''}
        <button class="red sm" data-del="${esc(f.path)}"><i class="fas fa-trash"></i></button></div>`).join('') || '<p class="muted">لا توجد ملفات</p>'}</div>`;

  $('#up', el).onchange = async e => {
    try {
      for (const f of e.target.files) await uploadFile(id, s.type, f);
      toast('تم الرفع'); serverPage(id, 'file');
    } catch (err) { toast(err.message, 'err'); }
  };
  el.onclick = async e => {
    const ed = e.target.closest('[data-edit]'), dl = e.target.closest('[data-del]'), mn = e.target.closest('[data-main]');
    try {
      if (ed) return editor(id, ed.dataset.edit);
      if (mn) { await api('PATCH', `/servers/${id}`, { entry: mn.dataset.main }); toast('تم تعيين الملف الرئيسي'); serverPage(id, 'file'); }
      if (dl && confirm(`حذف ${dl.dataset.del}؟`)) { await api('DELETE', `/servers/${id}/file?path=${encodeURIComponent(dl.dataset.del)}`); serverPage(id, 'file'); }
    } catch (err) { toast(err.message, 'err'); }
  };
}

async function editor(id, p) {
  const f = await api('GET', `/servers/${id}/file?path=${encodeURIComponent(p)}`);
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `<div class="modal" style="width:min(820px,100%)">
    <div class="row between"><h2 dir="ltr"><i class="fas fa-pen"></i> ${esc(p)}</h2><button class="ghost sm" id="ex">إغلاق</button></div>
    <textarea id="etxt" class="mt">${esc(f.text)}</textarea>
    <div class="row mt" style="justify-content:flex-end"><button id="esave"><i class="fas fa-save"></i> حفظ</button></div></div>`;
  document.body.appendChild(wrap);
  $('#ex', wrap).onclick = () => wrap.remove();
  $('#esave', wrap).onclick = async () => {
    try { await api('POST', `/servers/${id}/file`, { path: p, text: $('#etxt', wrap).value }); toast('تم الحفظ'); wrap.remove(); }
    catch (e) { toast(e.message, 'err'); }
  };
}

async function photoFiles(id, s, el) {
  el.innerHTML = `<h2><i class="fas fa-images"></i> File</h2>
    <label class="drop"><i class="fas fa-images"></i> ارفع صوراً (حد 2MB للصورة)<input type="file" id="pUp" accept="image/*" multiple hidden></label>
    <div class="row mt"><input id="pAlias" placeholder="رابط مخصص لصورة واحدة (اختياري)" dir="ltr"><button id="pBtn">رفع</button></div>
    <div class="gallery mt">${s.images.map(i => `<div class="card">
      <img src="${esc(i.url)}" alt="" loading="lazy">
      <div class="addr mt" style="font-size:11px">${location.origin}${esc(i.url)}</div>
      <div class="row between mt"><span class="muted small"><i class="fas fa-eye"></i> ${i.views}</span>
      <div class="row"><button class="ghost sm" data-cp="${esc(location.origin + i.url)}"><i class="fas fa-copy"></i></button>
      <button class="red sm" data-di="${esc(i.alias)}"><i class="fas fa-trash"></i></button></div></div></div>`).join('') || '<p class="muted">لا توجد صور</p>'}</div>`;
  let picked = [];
  $('#pUp', el).onchange = e => { picked = [...e.target.files]; toast(`${picked.length} صورة محددة`, 'info'); };
  $('#pBtn', el).onclick = async () => {
    if (!picked.length) return toast('اختر صوراً', 'err');
    const alias = $('#pAlias', el).value.trim();
    try {
      for (const f of picked) await api('POST', `/servers/${id}/images`, { name: f.name, data: await readAsDataURL(f), alias: picked.length === 1 ? alias : '' });
      toast('تم الرفع'); serverPage(id, 'file');
    } catch (e) { toast(e.message, 'err'); }
  };
  el.onclick = async e => {
    const cp = e.target.closest('[data-cp]'), di = e.target.closest('[data-di]');
    if (cp) { navigator.clipboard?.writeText(cp.dataset.cp); toast('تم نسخ الرابط', 'info'); }
    if (di && confirm('حذف هذه الصورة؟')) { await api('DELETE', `/servers/${id}/images/${di.dataset.di}`); serverPage(id, 'file'); }
  };
}

function tabSettings(id, s, el) {
  const isPhp = s.type === 'bot' && s.lang === 'php';
  el.innerHTML = `<h2><i class="fas fa-sliders-h"></i> Settings</h2>
    <div class="form">
      <div><label>اسم السيرفر</label><input id="sName" value="${esc(s.name)}"></div>
      ${s.type === 'website' ? `<div><label>اسم الموقع</label><input id="sSite" value="${esc(s.siteName)}"></div>` : ''}
      ${s.type === 'bot' ? `<div class="full"><label>الملف الرئيسي</label><input value="${esc(s.entry)}" disabled></div>` : ''}
      <div class="full"><label>صورة السيرفر (اختياري، حتى 200KB)</label><input type="file" id="sImg" accept="image/*"></div>
    </div>
    <div class="row mt"><button id="sSave"><i class="fas fa-save"></i> حفظ</button><button class="ghost" id="sRmImg">إزالة الصورة</button></div>
    ${s.url ? `<h3>الرابط العام</h3><div class="addr">${location.origin}${esc(s.url)}</div>` : ''}
    ${isPhp ? `<h3>نظام الويبهوك (PHP)</h3><p class="muted small">أي طلب يُرسل لهذا الرابط يصل إلى بوت PHP الخاص بك.</p>
      <div class="row"><button class="ghost" id="hkTest"><i class="fas fa-paper-plane"></i> اختبار الويبهوك</button><span class="muted small">الطلبات: ${s.hits}</span></div>` : ''}
    <div class="card mt" style="border-color:rgba(244,63,94,.4)"><div class="row between">
      <div><b>حذف السيرفر</b><p class="muted small">حذف نهائي للملفات والإعدادات.</p></div>
      <button class="red" id="sDel"><i class="fas fa-trash"></i> حذف</button></div></div>`;
  let img;
  $('#sImg', el).onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 200 * 1024) return toast('الصورة أكبر من 200KB', 'err');
    img = await readAsDataURL(f);
  };
  $('#sRmImg', el).onclick = () => { img = ''; toast('ستُزال الصورة عند الحفظ', 'info'); };
  $('#sSave', el).onclick = async () => {
    try {
      const body = { name: $('#sName', el).value.trim() };
      if (s.type === 'website') body.siteName = $('#sSite', el).value.trim();
      if (img !== undefined) body.image = img;
      await api('PATCH', `/servers/${id}`, body);
      toast('تم الحفظ'); serverPage(id, 'settings');
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#hkTest', el)?.addEventListener('click', async () => {
    try { await fetch(s.url + '?test=1'); toast('تم إرسال طلب الاختبار', 'info'); serverPage(id, 'settings'); }
    catch { toast('تعذر الوصول إلى الويبهوك', 'err'); }
  });
  $('#sDel', el).onclick = async () => {
    if (!confirm(`حذف السيرفر "${s.name}" نهائياً؟`)) return;
    try { await api('DELETE', `/servers/${id}`); toast('تم الحذف', 'info'); location.hash = '#/'; route(); }
    catch (e) { toast(e.message, 'err'); }
  };
}

function tabRes(id, s, el) {
  const draw = x => {
    const L = x.limits || { ram: 512, cpu: 50, spaceBytes: 1 };
    const st = x.stats || { ram: 0, cpu: 0 };
    el.innerHTML = `<h2><i class="fas fa-microchip"></i> Resources</h2>
      <p class="muted small">قياسات حقيقية من النظام لعمليات البوت. الحدود مضبوطة من الأدمن.</p>
      <div class="stats mt">
        <div class="stat"><b>${st.cpu}%</b><span>المعالج الآن (من ${L.cpu}%)</span><div class="bar"><i class="${pct(st.cpu, L.cpu) > 85 ? 'warn' : ''}" style="width:${pct(st.cpu, L.cpu)}%"></i></div></div>
        <div class="stat"><b>${st.ram} MB</b><span>الرام الآن (من ${L.ram} MB)</span><div class="bar"><i class="${pct(st.ram, L.ram) > 85 ? 'warn' : ''}" style="width:${pct(st.ram, L.ram)}%"></i></div></div>
        <div class="stat"><b>${fmt(x.size)}</b><span>التخزين (من ${fmt(L.spaceBytes)})</span></div>
        <div class="stat"><b>${x.views}</b><span>زيارات</span></div>
        <div class="stat"><b>${x.hits}</b><span>طلبات ويبهوك</span></div>
      </div>`;
  };
  draw(s);
  poll(async () => {
    if (!$('#panel')?.contains(el)) return clearInterval(timer);
    const x = await api('GET', `/servers/${id}`).catch(() => null);
    if (x && el.isConnected) draw(x);
  }, 2000);
}

/* ================= Admin ================= */
async function adminPage(tab) {
  const tabs = [['stats', 'fa-chart-pie', 'الإحصائيات'], ['accounts', 'fa-users', 'الحسابات'], ['servers', 'fa-server', 'الخوادم'], ['settings', 'fa-cog', 'الإعدادات']];
  mount(`<div class="layout"><nav class="card side" style="padding:8px">
    ${tabs.map(([k, i, n]) => `<a href="#/admin/${k}" class="${tab === k ? 'on' : ''}"><i class="fas ${i}"></i> ${n}</a>`).join('')}
    </nav><section class="card" id="panel" style="min-height:420px"></section></div>`);
  const el = $('#panel');
  try {
    if (tab === 'accounts') await adminAccounts(el);
    else if (tab === 'servers') await adminServers(el);
    else if (tab === 'settings') adminSettings(el);
    else await adminStats(el);
  } catch (e) { el.innerHTML = `<p>${esc(e.message)}</p>`; }
}

      <div class="stat"><b>${s.newToday}</b><span>جديدة اليوم</span></div>
      <div class="stat"><b>${s.servers}</b><span>السيرفرات</span></div>
      <div class="stat"><b>${s.running}</b><span>تعمل الآن</span></div>
      <div class="stat"><b>${s.processes}</b><span>عمليات بوتات حية</span></div>
      <div class="stat"><b>${s.byType.website} / ${s.byType.bot} / ${s.byType.photo}</b><span>مواقع / بوتات / صور</span></div>
      <div class="stat"><b>${fmt(s.storage)}</b><span>التخزين المستخدم</span></div>
      <div class="stat"><b>${s.views}</b><span>زيارات المواقع</span></div>
      <div class="stat"><b>${s.allocRam} MB</b><span>الرام المخصصة للحسابات</span></div>
      <div class="stat"><b>${s.allocCpu}%</b><span>المعالج المخصص للحسابات</span></div>
    </div>`;
}

async function adminAccounts(el) {
  const users = await api('GET', '/admin/users');
  el.innerHTML = `<h2><i class="fas fa-user-plus"></i> إنشاء حساب</h2>
    <form id="acF" class="form">
      <div><label>اليوزر</label><input id="acU" dir="ltr"></div>
      <div><label>كلمة المرور</label><input id="acP" dir="ltr"></div>
      <div><label>الأيام</label><input id="acD" type="number" value="10" min="1"></div>
      <div><label>المساحة (جيجا)</label><input id="acS" type="number" value="3" step="0.1"></div>
      <div><label>الرام (MB)</label><input id="acR" type="number" value="512"></div>
      <div><label>المعالج (%)</label><input id="acC" type="number" value="50"></div>
      <div class="full"><button type="submit" style="width:100%">إنشاء الحساب</button></div>
    </form>
    <h3>الحسابات (${users.length})</h3>
    <div class="tw"><table class="table">
      <tr><th>المستخدم</th><th>الأيام</th><th>الرام</th><th>المعالج</th><th>المساحة</th><th>الحالة</th><th>إجراء</th></tr>
      ${users.map(u => `<tr data-u="${esc(u.username)}">
        <td dir="ltr">${esc(u.username)}</td>
        <td>${Math.max(0, Math.ceil((u.expiresAt - Date.now()) / 864e5))} / ${u.days}
          <button class="ghost sm" data-act="days" title="إضافة أيام">+</button></td>
        <td><input type="number" value="${u.ram}" data-f="ram" style="width:90px"></td>
        <td><input type="number" value="${u.cpu}" data-f="cpu" style="width:70px"></td>
        <td>${fmt(u.used)} / ${fmt(u.spaceBytes)}</td>
        <td><span class="badge ${u.state === 'active' ? 'ok' : 'off'}">${esc(u.state)}</span></td>
        <td class="row">
          <button class="green sm" data-act="save" title="حفظ"><i class="fas fa-save"></i></button>
          <button class="ghost sm" data-act="ban">${u.banned ? 'رفع الحظر' : 'حظر'}</button>
          <button class="ghost sm" data-act="pass" title="تغيير كلمة المرور"><i class="fas fa-key"></i></button>
          <button class="red sm" data-act="del"><i class="fas fa-trash"></i></button>
        </td></tr>`).join('')}
    </table></div>`;

  $('#acF', el).onsubmit = async e => {
    e.preventDefault();
    try {
      await api('POST', '/admin/users', {
        username: $('#acU', el).value.trim(), password: $('#acP', el).value,
        days: $('#acD', el).value, gb: $('#acS', el).value, ram: $('#acR', el).value, cpu: $('#acC', el).value,
      });
      toast('تم إنشاء الحساب'); adminAccounts(el);
    } catch (err) { toast(err.message, 'err'); }
  };
  el.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const row = b.closest('tr'), u = row.dataset.u;
    try {
      const act = b.dataset.act;
      if (act === 'save') await api('PATCH', `/admin/users/${u}`, { ram: row.querySelector('[data-f="ram"]').value, cpu: row.querySelector('[data-f="cpu"]').value });
      if (act === 'days') { const d = prompt('كم يوماً تضيف؟', '10'); if (!d) return; await api('PATCH', `/admin/users/${u}`, { days: d }); }
      if (act === 'ban') await api('PATCH', `/admin/users/${u}`, { banned: b.textContent.trim() === 'حظر' });
      if (act === 'pass') { const p = prompt('كلمة المرور الجديدة (4 أحرف على الأقل)'); if (!p) return; await api('PATCH', `/admin/users/${u}`, { password: p }); }
      if (act === 'del') { if (!confirm(`حذف ${u} وكل سيرفراته؟`)) return; await api('DELETE', `/admin/users/${u}`); }
      toast('تم التحديث', 'info');
      adminAccounts(el);
    } catch (err) { toast(err.message, 'err'); }
  };
}

async function adminServers(el) {
  const list = await api('GET', '/admin/servers');
  el.innerHTML = `<h2><i class="fas fa-server"></i> الخوادم (${list.length})</h2>
    <div class="tw"><table class="table">
      <tr><th>المالك</th><th>الاسم</th><th>النوع</th><th>الحجم</th><th>الحالة</th><th>إجراء</th></tr>
      ${list.map(s => `<tr data-id="${esc(s.id)}">
        <td dir="ltr">${esc(s.owner)}</td><td>${esc(s.name)}</td>
        <td>${TYPE[s.type][1]}${s.lang ? ' • ' + (LANG[s.lang]?.[0] || '') : ''}</td>
        <td>${fmt(s.size)}</td><td>${badge(s)}</td>
        <td class="row">${s.type === 'bot' ? `<button class="ghost sm" data-act="pw"><i class="fas ${s.status === 'running' ? 'fa-stop' : 'fa-play'}"></i></button>` : ''}
          <button class="red sm" data-act="del"><i class="fas fa-trash"></i></button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">لا توجد سيرفرات</td></tr>'}
    </table></div>`;
  el.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.closest('tr').dataset.id;
    try {
      if (b.dataset.act === 'pw') { const s = list.find(x => x.id === id); await api('POST', `/admin/servers/${id}/power`, { on: s.status !== 'running' }); }
      else if (confirm('حذف هذا السيرفر نهائياً؟')) await api('DELETE', `/admin/servers/${id}`);
      else return;
      adminServers(el);
    } catch (err) { toast(err.message, 'err'); }
  };
}

function adminSettings(el) {
  el.innerHTML = `<h2><i class="fas fa-cog"></i> إعدادات المنصة</h2>
    <div class="form">
      <div><label>اسم المنصة</label><input id="stName" value="${esc(cfg.platformName)}"></div>
      <div><label>كلمة مرور الأدمن الجديدة (اتركه فارغاً للإبقاء)</label><input id="stPass" type="password" dir="ltr"></div>
      <div class="full"><label>إذاعة للمستخدمين (اتركه فارغاً لإلغائها)</label><input id="stBc" value="${esc(cfg.broadcast?.text || '')}"></div>
    </div>
    <div class="row mt"><button id="stSave"><i class="fas fa-save"></i> حفظ</button></div>`;
  $('#stSave', el).onclick = async () => {
    try {
      const body = { platformName: $('#stName', el).value.trim(), broadcast: $('#stBc', el).value };
      const p = $('#stPass', el).value;
      if (p) body.adminPassword = p;
      const r = await api('PATCH', '/admin/config', body);
      cfg = { ...cfg, ...r };
      toast('تم الحفظ'); route();
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* ================= Boot ================= */
fetch('/api/public').then(r => r.json()).then(d => { cfg = { ...cfg, ...d }; }).catch(() => {}).finally(route);
</script>
</body>
</html>
